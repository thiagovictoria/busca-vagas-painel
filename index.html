<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de vagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: painel de trabalho, direto, sem enfeite: o que avaliar agora e onde cada candidatura está.
   IDEA: um quadro de embarque de estação: a faixa verde mostra a situação, as linhas abaixo são as partidas (vagas).
   PICTURE: a lista de vagas com a nota grande à esquerda de cada linha é a própria figura.
   COLOUR and TYPE: verde profundo #00463c, verde-lima claro #e6f5c8, coral #ff6f59 para eliminatório; Inter Tight + Inter.
   LAYOUT: faixa verde com números no topo, abas, filtros, lista; detalhes num painel lateral/modal. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0f1714);--ink:light-dark(#14201c,#e7eeeb);--mute:light-dark(#5b6b66,#9fb0aa);
  --line:light-dark(#e3e9e6,#24322d);--soft:light-dark(#f4f7f5,#16211d);
  --green:#00463c;--lime:#e6f5c8;--coral:#ff6f59;--coral-ink:light-dark(#b8321f,#ff8f7d);
  --ok:light-dark(#0a7a5a,#4fd1a5);--mid:light-dark(#8a6a00,#e3bf4a);--low:light-dark(#7d8a86,#7d8a86)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;background:var(--green);padding:24px}
#login form{background:var(--bg);border-radius:14px;padding:32px;width:min(400px,100%);display:grid;gap:14px}
#login h1{font-size:32px}
#login p{margin:0;color:var(--mute);font-size:15px}
label{font-size:14px;font-weight:500;display:grid;gap:6px}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:96px;resize:vertical;width:100%}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;white-space:nowrap}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{color:var(--coral-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.err{color:var(--coral-ink);font-size:14px;min-height:1em}

/* faixa */
.band{background:var(--green);color:#fff;padding:22px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,36px)}
.top .who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--lime)}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border-top:1px solid rgba(255,255,255,.2)}
.num{padding:16px 16px 18px 0;border-right:1px solid rgba(255,255,255,.2)}
.num+.num{padding-left:16px}.num:last-child{border-right:0}
.num b{display:block;font:700 clamp(30px,5vw,44px)/1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.num span{font-size:14px;color:var(--lime)}
.num small{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-top:2px}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tab{flex:none;background:transparent;border:0;color:rgba(255,255,255,.8);padding:12px 16px;min-height:44px;border-radius:8px 8px 0 0;font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
.tab i{font-style:normal;font-weight:500;opacity:.7;margin-left:6px}

/* filtros */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0 8px}
.bar input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:0 14px;min-height:36px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--mute)}
.chk input{min-height:auto;width:18px;height:18px}

/* lista */
.group{margin:22px 0 6px;font-size:14px;font-weight:600;color:var(--mute);display:flex;gap:8px;align-items:baseline}
.group b{font:700 20px "Inter Tight",sans-serif;color:var(--ink)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.score{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font:700 26px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums;background:var(--soft)}
.score.hi{background:var(--green);color:var(--lime)}
.score.mid{color:var(--mid)}
.score.lo{color:var(--low)}
.score.el{color:var(--coral-ink);background:light-dark(#fff0ed,#2a1714)}
.ttl{font-weight:600;font-size:17px;line-height:1.3;background:none;border:0;padding:0;text-align:left}
.ttl:hover{text-decoration:underline}
.co{color:var(--mute);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-top:4px}
.meta span{white-space:nowrap}
.why{font-size:14px;margin-top:6px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.elim{font-size:14px;margin-top:6px;color:var(--coral-ink)}
.rec{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);margin-right:6px;vertical-align:2px}
.rec.candidatar{background:light-dark(#dff3e9,#173a2e);color:var(--ok)}
.rec.avaliar{background:light-dark(#fbf1d2,#3a3112);color:var(--mid)}
.rec.eliminado{background:light-dark(#fff0ed,#2a1714);color:var(--coral-ink)}
.tag{font-size:12px;font-weight:600;color:var(--coral-ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.acts select{min-height:36px;padding:4px 8px;font-size:14px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}

/* detalhe */
dialog{border:0;padding:0;width:min(820px,100vw);max-height:100vh;height:100vh;margin:0 0 0 auto;background:var(--bg);color:var(--ink);box-shadow:-12px 0 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,20,15,.45)}
.dh{position:sticky;top:0;background:var(--bg);padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;z-index:1}
.dh h2{font-size:24px;flex:1}
.db{padding:20px 24px 40px;display:grid;gap:26px}
.db h3{font-size:17px;margin-bottom:10px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .score{width:84px;height:84px;font-size:34px}
.crit{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.cr .tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.cr .tr i{display:block;height:100%;background:var(--green)}
.cr b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.two ul{margin:0;padding-left:18px;font-size:15px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.hist{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:6px}
.hist li{display:flex;gap:10px}.hist time{color:var(--mute);white-space:nowrap;min-width:120px}
.desc{white-space:pre-wrap;font-size:15px;background:var(--soft);padding:16px;border-radius:10px;max-height:480px;overflow:auto}
.foot{font-size:13px;color:var(--mute)}
a{color:inherit}
.link{font-weight:600;color:var(--ok)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:10;width:max-content;max-width:calc(100vw - 32px)}
#toast span{flex:1}
#toast button{flex:none;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;min-height:34px;padding:0 10px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.row{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
@media(max-width:700px){
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .num:nth-child(2){border-right:0}.num:nth-child(3){padding-left:0}
  .num:nth-child(n+3){border-top:1px solid rgba(255,255,255,.2)}
  .row{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .score{width:52px;height:52px;font-size:21px}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .two,.form{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:120px minmax(0,1fr)}
  .cr{grid-template-columns:90px minmax(0,1fr) 46px}
  .dh,.db{padding-left:16px;padding-right:16px}
  .tab{padding:12px 12px}
}
</style>
</head>
<body>

<section id="login" class="hide">
  <form id="fLogin">
    <h1>Painel de vagas</h1>
    <p>Entre com o usuário criado no Supabase.</p>
    <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit">Entrar</button>
    <div class="err" id="lErr" role="alert"></div>
  </form>
</section>

<div id="app" class="hide">
  <header class="band">
    <div class="wrap">
      <div class="top">
        <h1>Busca de vagas</h1>
        <div class="who"><span id="uEmail"></span>
          <button class="btn sm" id="bRefresh" type="button">Atualizar</button>
          <button class="btn sm" id="bSair" type="button">Sair</button></div>
      </div>
      <div class="nums" id="nums"></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="bar">
      <input type="search" id="q" placeholder="Buscar por cargo ou empresa" aria-label="Buscar">
      <div class="chips" id="chips"></div>
      <select id="ord" aria-label="Ordenar">
        <option value="nota">Maior nota</option>
        <option value="data">Mais recentes</option>
        <option value="prazo">Prazo mais próximo</option>
      </select>
      <label class="chk" id="lElim"><input type="checkbox" id="cElim"> Mostrar eliminadas</label>
    </div>
    <div id="list" aria-live="polite"></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dh"><h2 id="dTitle"></h2><button class="btn sm" id="dClose" type="button">Fechar</button></div>
  <div class="db" id="dBody"></div>
</dialog>

<div id="toast" class="hide" role="status"><span id="tMsg"></span><button id="tUndo" type="button">Desfazer</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
{
const SB_URL = "https://mjayohnvehotudjdmbwt.supabase.co";
const SB_KEY = "sb_publishable_RabLRPw9lUqaIc8QmcJVbA_5oXXYEHj"; // chave publica; os dados ficam protegidos pelo login + RLS
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const STATUS = {
  nova:"Nova", aprovada:"Quero me inscrever", inscrita:"Inscrita", em_analise:"Em análise", case:"Case",
  entrevista:"Entrevista", proposta:"Proposta", contratado:"Contratado",
  descartada:"Descartada", reprovado:"Reprovado", sem_retorno:"Sem retorno"
};
const PIPE = ["aprovada","inscrita","em_analise","case","entrevista","proposta","contratado"];
const FIM = ["descartada","reprovado","sem_retorno"];
const REC = {candidatar:"Candidatar", avaliar:"Avaliar", pular:"Pular", eliminado:"Eliminado"};
const CRIT = {tecnico:["Técnico",35], area:["Área",25], senioridade:["Senioridade",15], requisitos:["Requisitos",15], local:["Local",10]};
const COLS = "chave_unica,status,etapa,inscrito_por,data_inscricao,observacoes,atualizado_em," +
  "vaga:vagas(titulo,empresa,cidade,estado,modalidade,tipo_contrato,salario_label,salario_min,salario_max," +
  "publicado_em,prazo_inscricao,link,senioridade_titulo,encerrada_na_plataforma,encerrada_detectada_em,primeiro_visto_em," +
  "nota_match,motivo_match,match_criterios,match_pontos_fortes,match_lacunas,match_recomendacao,match_eliminatorio," +
  "match_perfil_versao,match_modelo,match_avaliado_em)";

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k,d){try{return localStorage.getItem("painel."+k) ?? d}catch{return d}}, set(k,v){try{localStorage.setItem("painel."+k,v)}catch{}}};

let itens = [], ultima = null;
let st = {tab: store.get("tab","avaliar"), rec: store.get("rec","todas"), ord: store.get("ord","nota"), q:"", elim: store.get("elim","0")==="1"};

/* ---------- formatação ---------- */
const dt = s => s ? new Date(s) : null;
const fData = s => { const d = dt(s); return d ? d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—"; };
const fHora = s => { const d = dt(s); return d ? d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—"; };
function fRel(s){
  const d = dt(s); if(!d) return "—";
  const h = (Date.now()-d)/36e5;
  if(h < 1) return "há " + Math.max(1,Math.round(h*60)) + " min";
  if(h < 24) return "há " + Math.round(h) + " h";
  const dias = Math.round(h/24);
  return dias === 1 ? "ontem" : "há " + dias + " dias";
}
const brl = n => "R$ " + Number(n).toLocaleString("pt-BR",{maximumFractionDigits:0});
function fSal(v){
  if(v.salario_min && v.salario_max) return v.salario_min === v.salario_max ? brl(v.salario_min) : brl(v.salario_min) + " a " + brl(v.salario_max).replace("R$ ","");
  if(v.salario_max) return "até " + brl(v.salario_max);
  if(v.salario_min) return "a partir de " + brl(v.salario_min);
  return v.salario_label || "Salário não informado";
}
const fLocal = v => [v.cidade, v.estado].filter(Boolean).join(" / ") || "Local não informado";
function cls(v){
  if(v.match_recomendacao === "eliminado") return "el";
  const n = v.nota_match; if(n == null) return "";
  return n >= 75 ? "hi" : n >= 50 ? "mid" : "lo";
}
const encerrada = it => !!it.vaga.encerrada_na_plataforma;

/* ---------- dados ---------- */
async function carregar(){
  $("list").innerHTML = '<p class="empty">Carregando…</p>';
  const todos = [];
  for(let de = 0; ; de += 1000){
    const {data, error} = await sb.from("candidaturas").select(COLS).range(de, de+999);
    if(error){ $("list").innerHTML = '<p class="empty">Erro ao carregar: ' + esc(error.message) + '</p>'; return; }
    todos.push(...data.filter(x => x.vaga));
    if(data.length < 1000) break;
  }
  itens = todos;
  const {data: ex} = await sb.from("execucoes").select("ciclo,terminado_em,sucesso,novas_aprovadas,erros").order("ciclo",{ascending:false}).limit(1);
  ultima = ex && ex[0] || null;
  render();
}

async function mudar(k, novo, extra = {}, silencioso = false){
  const it = itens.find(x => x.chave_unica === k); if(!it) return false;
  const antes = {status: it.status, data_inscricao: it.data_inscricao, inscrito_por: it.inscrito_por, observacoes: it.observacoes, etapa: it.etapa};
  const patch = {...extra};
  if(novo) patch.status = novo;
  if(novo === "inscrita" && !it.data_inscricao && !("data_inscricao" in extra)){ patch.data_inscricao = new Date().toISOString(); patch.inscrito_por = it.inscrito_por || "voce"; }
  const {data, error} = await sb.from("candidaturas").update(patch).eq("chave_unica", k).select("chave_unica,status,data_inscricao,inscrito_por,observacoes,etapa,atualizado_em");
  if(error || !data || !data.length){ toast("Não foi possível salvar" + (error ? ": " + error.message : " (sem permissão)")); return false; }
  Object.assign(it, data[0]);
  render();
  if(!silencioso && novo && novo !== antes.status){
    toast("“" + it.vaga.titulo + "” → " + STATUS[novo], async () => {
      const {data: d2} = await sb.from("candidaturas").update(antes).eq("chave_unica", k).select("chave_unica,status,data_inscricao,inscrito_por,observacoes,etapa,atualizado_em");
      if(d2 && d2[0]) Object.assign(it, d2[0]);
      render(); toast("Desfeito");
    });
  }
  return true;
}

/* ---------- toast ---------- */
let tTimer;
function toast(msg, desfazer){
  $("tMsg").textContent = msg;
  $("tUndo").classList.toggle("hide", !desfazer);
  $("tUndo").onclick = () => { $("toast").classList.add("hide"); desfazer && desfazer(); };
  $("toast").classList.remove("hide");
  clearTimeout(tTimer); tTimer = setTimeout(() => $("toast").classList.add("hide"), desfazer ? 7000 : 3500);
}

/* ---------- abas e contagens ---------- */
const naAba = {
  avaliar: it => it.status === "nova" && !encerrada(it),
  candidaturas: it => PIPE.includes(it.status),
  arquivo: it => FIM.includes(it.status) || (it.status === "nova" && encerrada(it))
};
function render(){
  const av = itens.filter(naAba.avaliar);
  const avOk = av.filter(i => i.vaga.match_recomendacao !== "eliminado");
  const recom = avOk.filter(i => i.vaga.match_recomendacao === "candidatar").length;
  const novasHoje = avOk.filter(i => (Date.now() - dt(i.vaga.primeiro_visto_em)) < 864e5).length;
  const paraInscrever = itens.filter(i => i.status === "aprovada").length;
  const proc = itens.filter(i => ["inscrita","em_analise","case","entrevista","proposta"].includes(i.status));
  const entrev = proc.filter(i => ["case","entrevista","proposta"].includes(i.status)).length;
  const col = ultima ? (ultima.sucesso ? "Última coleta " + fRel(ultima.terminado_em || ultima.ciclo) : "Última coleta com falha") : "Sem coletas";
  $("nums").innerHTML = [
    [avOk.length, "para avaliar", recom + " recomendadas · " + novasHoje + " nas últimas 24 h"],
    [paraInscrever, "para inscrever", "marcadas como “quero me inscrever”"],
    [proc.length, "em processo", entrev + " em case, entrevista ou proposta"],
    [ultima ? (ultima.novas_aprovadas ?? 0) : "—", "novas na última coleta", col]
  ].map(([n,l,s]) => '<div class="num"><b>' + esc(n) + '</b><span>' + esc(l) + '</span><small>' + esc(s) + '</small></div>').join("");

  const cont = {avaliar: avOk.length, candidaturas: itens.filter(naAba.candidaturas).length, arquivo: itens.filter(naAba.arquivo).length};
  $("tabs").innerHTML = [["avaliar","Para avaliar"],["candidaturas","Candidaturas"],["arquivo","Arquivo"]]
    .map(([k,l]) => '<button class="tab" role="tab" type="button" data-tab="' + k + '" aria-selected="' + (st.tab===k) + '">' + l + '<i>' + cont[k] + '</i></button>').join("");

  const nElim = av.length - avOk.length;
  $("lElim").classList.toggle("hide", st.tab !== "avaliar");
  $("lElim").lastChild.textContent = " Mostrar eliminadas (" + nElim + ")";
  $("cElim").checked = st.elim;
  $("chips").classList.toggle("hide", st.tab !== "avaliar");
  $("chips").innerHTML = ["todas","candidatar","avaliar","pular"].map(r =>
    '<button class="chip" type="button" data-rec="' + r + '" aria-pressed="' + (st.rec===r) + '">' + (r==="todas" ? "Todas" : REC[r]) + '</button>').join("");
  $("ord").value = st.ord;
  lista();
}

function ordenar(a){
  const by = {
    nota: (x,y) => (y.vaga.nota_match ?? -1) - (x.vaga.nota_match ?? -1) || (dt(y.vaga.publicado_em) - dt(x.vaga.publicado_em)),
    data: (x,y) => dt(y.vaga.publicado_em) - dt(x.vaga.publicado_em),
    prazo: (x,y) => (x.vaga.prazo_inscricao || "9999").localeCompare(y.vaga.prazo_inscricao || "9999")
  };
  return a.sort(by[st.ord] || by.nota);
}

function lista(){
  const q = st.q.trim().toLowerCase();
  let a = itens.filter(naAba[st.tab]);
  if(st.tab === "avaliar"){
    if(!st.elim) a = a.filter(i => i.vaga.match_recomendacao !== "eliminado");
    if(st.rec !== "todas") a = a.filter(i => i.vaga.match_recomendacao === st.rec);
  }
  if(q) a = a.filter(i => ((i.vaga.titulo||"") + " " + (i.vaga.empresa||"")).toLowerCase().includes(q));
  ordenar(a);
  if(!a.length){
    $("list").innerHTML = '<p class="empty">' + (q ? "Nada encontrado para essa busca." :
      st.tab === "avaliar" ? "Nenhuma vaga esperando avaliação." :
      st.tab === "candidaturas" ? "Nenhuma candidatura ainda. Marque vagas como “Quero me inscrever” na aba Para avaliar." :
      "Nada arquivado.") + '</p>';
    return;
  }
  if(st.tab === "candidaturas"){
    $("list").innerHTML = PIPE.map(s => {
      const g = a.filter(i => i.status === s); if(!g.length) return "";
      return '<h3 class="group"><b>' + STATUS[s] + '</b>' + g.length + '</h3>' + g.map(linha).join("");
    }).join("");
  } else {
    $("list").innerHTML = a.map(linha).join("");
  }
}

function linha(it){
  const v = it.vaga, c = cls(v);
  const rec = v.match_recomendacao ? '<span class="rec ' + esc(v.match_recomendacao) + '">' + esc(REC[v.match_recomendacao] || v.match_recomendacao) + '</span>' : "";
  let acts = "";
  if(it.status === "nova" && !encerrada(it))
    acts = '<button class="btn sm pri" data-act="aprovada">Quero me inscrever</button><button class="btn sm warn" data-act="descartada">Descartar</button>';
  else if(it.status === "aprovada")
    acts = '<button class="btn sm pri" data-act="inscrita">Marcar inscrita</button><button class="btn sm warn" data-act="descartada">Descartar</button>';
  else if(PIPE.includes(it.status))
    acts = '<select data-sel aria-label="Situação">' + Object.keys(STATUS).filter(s => s !== "nova").map(s => '<option value="' + s + '"' + (s===it.status?" selected":"") + '>' + STATUS[s] + '</option>').join("") + '</select>';
  else if(!encerrada(it) || it.status !== "nova")
    acts = '<button class="btn sm" data-act="nova">Voltar para avaliação</button>';
  const extra = [];
  if(encerrada(it)) extra.push('<span class="tag">Encerrada ' + esc(fData(v.encerrada_detectada_em)) + '</span>');
  if(v.prazo_inscricao) extra.push('<span>Prazo ' + esc(fData(v.prazo_inscricao)) + '</span>');
  if(it.data_inscricao) extra.push('<span>Inscrita em ' + esc(fData(it.data_inscricao)) + '</span>');
  return '<article class="row" data-k="' + esc(it.chave_unica) + '">' +
    '<div class="score ' + c + '" title="Nota de match">' + esc(v.nota_match ?? "–") + '</div>' +
    '<div><button class="ttl" type="button" data-open>' + esc(v.titulo) + '</button>' +
    '<div class="co">' + rec + esc(v.empresa) + '</div>' +
    '<div class="meta"><span>' + esc(fLocal(v)) + '</span><span>' + esc(v.modalidade || "") + '</span><span>' + esc(fSal(v)) + '</span><span>Publicada ' + esc(fRel(v.publicado_em)) + '</span>' + extra.join("") + '</div>' +
    (v.match_eliminatorio ? '<div class="elim">' + esc(v.match_eliminatorio) + '</div>' : v.motivo_match ? '<div class="why">' + esc(v.motivo_match) + '</div>' : "") +
    '</div><div class="acts">' + acts + '<a class="btn sm" href="' + esc(v.link) + '" target="_blank" rel="noopener">Abrir ↗</a></div></article>';
}

/* ---------- detalhe ---------- */
async function abrir(k){
  const it = itens.find(x => x.chave_unica === k); if(!it) return;
  const v = it.vaga;
  $("dTitle").textContent = v.titulo || "";
  const crit = v.match_criterios || {};
  const lst = a => a && a.length ? '<ul>' + a.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : '<p class="foot">—</p>';
  const opts = Object.keys(STATUS).map(s => '<option value="' + s + '"' + (s===it.status?" selected":"") + '>' + STATUS[s] + '</option>').join("");
  const dIns = it.data_inscricao ? new Date(it.data_inscricao).toLocaleDateString("sv-SE") : "";
  $("dBody").innerHTML =
    '<div class="hero"><div class="score ' + cls(v) + '">' + esc(v.nota_match ?? "–") + '</div><div>' +
      '<div class="co">' + (v.match_recomendacao ? '<span class="rec ' + esc(v.match_recomendacao) + '">' + esc(REC[v.match_recomendacao] || "") + '</span>' : "") + esc(v.empresa) + '</div>' +
      '<div class="meta"><span>' + esc(fLocal(v)) + '</span><span>' + esc(v.modalidade||"") + '</span><span>' + esc(fSal(v)) + '</span></div>' +
      '<p style="margin:8px 0 0"><a class="link" href="' + esc(v.link) + '" target="_blank" rel="noopener">Abrir vaga na Gupy ↗</a></p></div></div>' +
    (v.match_eliminatorio ? '<div class="elim"><b>Eliminatório:</b> ' + esc(v.match_eliminatorio) + '</div>' : "") +
    (v.motivo_match ? '<p style="margin:0">' + esc(v.motivo_match) + '</p>' : "") +
    '<section><h3>Nota por critério</h3><div class="crit">' + Object.entries(CRIT).map(([key,[nome,max]]) => {
      const n = Number(crit[key] ?? 0);
      return '<div class="cr"><span>' + nome + '</span><div class="tr"><i style="width:' + Math.max(0,Math.min(100,n/max*100)) + '%"></i></div><b>' + n + ' / ' + max + '</b></div>';
    }).join("") + '</div></section>' +
    '<section class="two"><div><h3>Pontos fortes</h3>' + lst(v.match_pontos_fortes) + '</div><div><h3>Lacunas</h3>' + lst(v.match_lacunas) + '</div></section>' +
    '<section><h3>Minha candidatura</h3><form class="form" id="fCand">' +
      '<label>Situação<select id="cStatus">' + opts + '</select></label>' +
      '<label>Data da inscrição<input type="date" id="cData" value="' + esc(dIns) + '"></label>' +
      '<label class="full">Etapa atual (opcional)<input id="cEtapa" value="' + esc(it.etapa||"") + '" placeholder="Ex.: teste online, entrevista com gestor"></label>' +
      '<label class="full">Observações<textarea id="cObs">' + esc(it.observacoes||"") + '</textarea></label>' +
      '<div class="full"><button class="btn pri" type="submit">Salvar</button></div></form></section>' +
    '<section><h3>Histórico</h3><ul class="hist" id="hist"><li>Carregando…</li></ul></section>' +
    '<section><h3>Detalhes da vaga</h3><dl class="kv">' +
      [["Contrato", v.tipo_contrato],["Senioridade no título", v.senioridade_titulo],["Publicada", fHora(v.publicado_em)],
       ["Vista pela 1ª vez", fHora(v.primeiro_visto_em)],["Prazo de inscrição", v.prazo_inscricao ? fData(v.prazo_inscricao) : "—"],
       ["Situação na Gupy", v.encerrada_na_plataforma ? "Encerrada (detectada " + fHora(v.encerrada_detectada_em) + ")" : "Aberta"]]
      .map(([a,b]) => '<dt>' + a + '</dt><dd>' + esc(b || "—") + '</dd>').join("") + '</dl></section>' +
    '<section><h3>Descrição</h3><div class="desc" id="desc">Carregando…</div></section>' +
    '<p class="foot">Avaliada em ' + esc(fHora(v.match_avaliado_em)) + ' · versão ' + esc(v.match_perfil_versao || "—") + ' · ' + esc(v.match_modelo || "—") + ' · ' + esc(k) + '</p>';
  $("dlg").showModal();
  $("dlg").scrollTop = 0;

  $("fCand").addEventListener("submit", async e => {
    e.preventDefault();
    const d = $("cData").value;
    const extra = {observacoes: $("cObs").value.trim() || null, etapa: $("cEtapa").value.trim() || null,
                   data_inscricao: d ? new Date(d + "T12:00:00").toISOString() : null};
    const ok = await mudar(k, $("cStatus").value, extra, true);
    if(ok){ toast("Candidatura salva"); historico(k); }
  });
  historico(k);
  const {data} = await sb.from("vagas").select("descricao").eq("chave_unica", k).maybeSingle();
  if($("desc")) $("desc").textContent = (data && data.descricao) || "Sem descrição.";
}

async function historico(k){
  const {data} = await sb.from("historico").select("status_anterior,status_novo,origem,alterado_em").eq("chave_unica", k).order("alterado_em",{ascending:false});
  if(!$("hist")) return;
  $("hist").innerHTML = (data && data.length ? data : []).map(h =>
    '<li><time>' + esc(fHora(h.alterado_em)) + '</time><span>' + (h.status_anterior ? esc(STATUS[h.status_anterior]||h.status_anterior) + ' → ' : "") +
    '<b>' + esc(STATUS[h.status_novo]||h.status_novo) + '</b> · ' + (h.origem === "usuario" ? "você" : "robô") + '</span></li>').join("") || "<li>Sem registros.</li>";
}

/* ---------- eventos ---------- */
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(b){ st.tab = b.dataset.tab; store.set("tab", st.tab); render(); } });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-rec]"); if(b){ st.rec = b.dataset.rec; store.set("rec", st.rec); render(); } });
$("ord").addEventListener("change", e => { st.ord = e.target.value; store.set("ord", st.ord); lista(); });
$("q").addEventListener("input", e => { st.q = e.target.value; lista(); });
$("cElim").addEventListener("change", e => { st.elim = e.target.checked; store.set("elim", st.elim ? "1" : "0"); render(); });
$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if(!row) return;
  const k = row.dataset.k;
  const act = e.target.closest("[data-act]");
  if(act){ mudar(k, act.dataset.act); return; }
  if(e.target.closest("[data-open]")) abrir(k);
});
$("list").addEventListener("change", e => { const s = e.target.closest("[data-sel]"); if(s) mudar(s.closest(".row").dataset.k, s.value); });
$("dClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if(e.target === $("dlg")) $("dlg").close(); });
$("bRefresh").addEventListener("click", carregar);
$("bSair").addEventListener("click", async () => { await sb.auth.signOut(); mostrar(null); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !$("app").classList.contains("hide") && !$("dlg").open) carregar(); });

$("fLogin").addEventListener("submit", async e => {
  e.preventDefault(); $("lErr").textContent = "";
  const {data, error} = await sb.auth.signInWithPassword({email: $("lEmail").value.trim(), password: $("lSenha").value});
  if(error){ $("lErr").textContent = error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message; return; }
  $("lSenha").value = "";
  mostrar(data.session);
});

let logado = false;
function mostrar(sess){
  const on = !!sess;
  $("login").classList.toggle("hide", on);
  $("app").classList.toggle("hide", !on);
  if(on){ $("uEmail").textContent = sess.user.email; if(!logado){ logado = true; carregar(); } }
  else logado = false;
}
sb.auth.getSession().then(({data}) => mostrar(data.session));
sb.auth.onAuthStateChange((ev, sess) => { if(ev === "SIGNED_OUT") mostrar(null); });
}
</script>
</body>
</html>
